name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Typecheck & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: Unit + equivalence tests
        run: bun run test

      - name: Build
        run: bun run build

      - name: dist/ is committed — verify it matches source
        run: |
          git diff --exit-code -- dist/index.js dist/index.cjs dist/index.d.ts dist/index.d.cts || {
            echo "::error::dist/ is out of date. Run 'bun run build' and commit the result.";
            exit 1;
          }

      - name: E2E (published entry point)
        run: bun run test:e2e
